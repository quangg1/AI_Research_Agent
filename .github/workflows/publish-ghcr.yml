name: publish-ghcr

# Builds and pushes Kiln images to GitHub Container Registry.
# First successful run makes docker-compose.ghcr.yml useful for pulls.
# Packages may be private by default — set visibility to Public under
# GitHub → Packages, or docker login ghcr.io before pull.
on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/fix-kiln-memo-quality-4dd5"]
    tags: ["v*"]
    paths:
      - "apps/agent/**"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "infra/postgres/**"
      - "data/scenarios/**"
      - "docker-compose.yml"
      - ".github/workflows/publish-ghcr.yml"

env:
  REGISTRY: ghcr.io
  OWNER: quangg1

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kiln-agent
            context: .
            file: apps/agent/Dockerfile
          - name: kiln-api
            context: ./apps/api
            file: apps/api/Dockerfile
          - name: kiln-web
            context: .
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AUTH_MODE=dev
            VITE_API_URL=