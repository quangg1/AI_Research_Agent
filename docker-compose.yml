services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiln
      POSTGRES_USER: kiln
      POSTGRES_PASSWORD: kiln_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiln -d kiln"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://kiln:kiln_dev_password@postgres:5432/kiln
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      AGENT_SHARED_KEY: ${AGENT_SHARED_KEY:-}
      LLM_BYOK_REQUIRED: ${LLM_BYOK_REQUIRED:-false}
    volumes:
      - ./data/corpus:/app/data/corpus
      - kiln_memory:/app/data/memory
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: kiln_dev_password
    volumes:
      - ./infra/postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - for file in /migrations/*.sql; do psql -h postgres -U kiln -d kiln -v ON_ERROR_STOP=1 -f "$$file"; done
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kiln:kiln_dev_password@postgres:5432/kiln
      REDIS_URL: redis://redis:6379/0
      AGENT_BASE_URL: http://agent:8000
      AUTH_MODE: ${AUTH_MODE:-dev}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}
      API_SHARED_KEY: ${API_SHARED_KEY:-}
      API_TO_AGENT_KEY: ${API_TO_AGENT_KEY:-}
      AGENT_SHARED_KEY: ${AGENT_SHARED_KEY:-}
      CORPUS_UPLOAD_DIR: /app/data/corpus/orgs
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      LLM_BYOK_REQUIRED: ${LLM_BYOK_REQUIRED:-false}
    volumes:
      - ./data/corpus:/app/data/corpus
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
    env_file: .env
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  qdrant_data:
  kiln_memory:
